<!DOCTYPE html>
<html>
<head>
<title> My First Website</title>

  <style>
  h1{
    color:purple;
    }
  p{
    color:black;
  }
  body{
    background-color:lightpink;
    text-align:center;
  }
    button{
      padding:10px;
      margin:5px;
      cursor:pointer;
      }
</style>
</head>
  
<body>
  <h1> Hello World!</h1>
  <p> This is my first website!</p>
  <button onclick="changeColor('lightblue')"> Blue</button>
  <button onclick="changeColor('lightpurple')"> Lavender</button>
  <button onclick="changeColor('pink')"> Pink</button>

  <script>
    function changeColor(color){
      document.body.style.backgroundColor=color;
    }
  </script>
  
</body>
</html>
